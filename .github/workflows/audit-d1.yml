name: Audit Recipes D1 (read-only)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Count recipe tables and check foreign keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bfe38ff4f7a7cff066e54569c3b2560b
        run: |
          set -eu
          for table in recipes ingredient_groups ingredients instruction_groups instruction_steps; do
            echo "=== $table ==="
            npx wrangler d1 execute recipes-db --remote --command "SELECT COUNT(*) AS rows FROM $table;"
          done
          echo "=== Foreign-key violations (should be empty) ==="
          npx wrangler d1 execute recipes-db --remote --command "PRAGMA foreign_key_check;"
          echo "=== Orphan ingredient groups ==="
          npx wrangler d1 execute recipes-db --remote --command "SELECT COUNT(*) AS orphans FROM ingredient_groups g LEFT JOIN recipes r ON r.id=g.recipe_id WHERE r.id IS NULL;"
          echo "=== Orphan instruction groups ==="
          npx wrangler d1 execute recipes-db --remote --command "SELECT COUNT(*) AS orphans FROM instruction_groups g LEFT JOIN recipes r ON r.id=g.recipe_id WHERE r.id IS NULL;"
