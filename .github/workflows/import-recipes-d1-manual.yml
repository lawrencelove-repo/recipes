
name: Import Recipes D1 (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recipes-d1-initial-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: bfe38ff4f7a7cff066e54569c3b2560b

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: feature/cloudflare-d1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install

      - name: Generate seed SQL
        run: node scripts/generate-d1-seed.cjs

      - name: Validate seed locally
        run: |
          python3 - <<'PY'
          import sqlite3
          con = sqlite3.connect(":memory:")
          for filename in [
              "migrations/0001_recipes.sql",
              "migrations/0002_seed_recipes.sql"
          ]:
              with open(filename, encoding="utf-8") as f:
                  con.executescript(f.read())

          for table in [
              "recipes",
              "ingredient_groups",
              "ingredients",
              "instruction_groups",
              "instruction_steps"
          ]:
              count = con.execute(
                  f"SELECT COUNT(*) FROM {table}"
              ).fetchone()[0]
              print(f"{table}: {count}")
              assert count > 0
          PY

      - name: Create D1 schema
        run: npx wrangler d1 execute recipes-db --remote --file migrations/0001_recipes.sql

      - name: Verify destination is empty
        run: |
          npx wrangler d1 execute recipes-db --remote \
            --command "SELECT CASE WHEN (SELECT COUNT(*) FROM recipes)=0 THEN 'EMPTY' ELSE 'NOT_EMPTY' END AS import_status" \
            --json > d1-check.json

          python3 - <<'PY'
          import json
          with open("d1-check.json") as f:
              data = json.load(f)

          assert data[0]["results"][0]["import_status"] == "EMPTY", \
              "Recipes table is not empty. Import cancelled."

          print("Destination is empty. Import permitted.")
          PY

      - name: Import recipes into D1
        run: npx wrangler d1 execute recipes-db --remote --file migrations/0002_seed_recipes.sql

      - name: Create authentication tables
        run: npx wrangler d1 execute recipes-db --remote --file migrations/0003_auth.sql

      - name: Verify imported records
        run: |
          npx wrangler d1 execute recipes-db --remote \
            --command "SELECT (SELECT COUNT(*) FROM recipes) AS recipes, (SELECT COUNT(*) FROM ingredients) AS ingredients, (SELECT COUNT(*) FROM instruction_steps) AS steps"
