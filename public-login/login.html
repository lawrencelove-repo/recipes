<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipes — Sign in</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#16191c;color:#f5f5f5;font:16px system-ui}
main{width:min(92vw,390px);padding:32px;background:#24292d;border-radius:16px;box-sizing:border-box}
h1{margin-top:0}label{display:block;margin:16px 0 6px}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:8px;font:inherit}
input{border:1px solid #777;background:#fff;color:#111}button{margin-top:16px;border:0;background:#d6e7e1;color:#111;cursor:pointer}
p{line-height:1.5}#message{min-height:2em;font-size:14px}small{color:#c4c4c4}
</style></head><body><main><h1>Recipes</h1><p>Request a one-time code to access your recipes.</p>
<form id="request"><button type="submit">Send access code</button></form>
<form id="verify" hidden><label for="code">Six-digit code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
<button type="submit">Sign in</button></form><p id="message" role="status"></p><small>Codes expire after 10 minutes.</small></main>
<script src="/login.js"></script></body></html>
