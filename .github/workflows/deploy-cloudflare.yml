name: Deploy Recipes
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recipes-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check worker/index.js
          node --check worker/recipe-write.js
          node --check js/db.js
          node --check scripts/build-worker-assets.cjs
      - run: npm install --no-audit --no-fund
      - name: Build and verify static assets
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/login.html
          test -f dist/js/db.js
          grep -q 'RECIPES_CLOUDFLARE = true' dist/index.html
          test ! -e dist/sw.js
          ! grep -q 'navigator.serviceWorker.register' dist/index.html
      - name: Validate Wrangler configuration
        run: npx wrangler deploy --dry-run --outdir /tmp/recipes-worker-check

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Build curated static assets
        run: npm run build
      # D1 was imported separately; do not re-run seed migrations on deploy.
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bfe38ff4f7a7cff066e54569c3b2560b
      - name: Configure Resend API secret
        run: printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bfe38ff4f7a7cff066e54569c3b2560b
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - name: Configure authentication signing secret
        run: printf '%s' "$AUTH_SECRET" | npx wrangler secret put AUTH_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bfe38ff4f7a7cff066e54569c3b2560b
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
