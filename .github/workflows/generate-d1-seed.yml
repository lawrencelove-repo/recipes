name: Generate and validate D1 recipe seed
on:
  workflow_dispatch:
  push:
    branches: [feature/cloudflare-d1]
    paths:
      - scripts/generate-d1-seed.cjs
      - js/seed-data.js
      - js/parser.js
      - js/units.js
      - .github/workflows/generate-d1-seed.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate SQL
        run: node scripts/generate-d1-seed.cjs
      - name: Validate SQL using SQLite
        run: |
          python3 - <<'PY'
          import sqlite3
          con=sqlite3.connect(":memory:")
          con.executescript(open("migrations/0001_recipes.sql",encoding="utf-8").read())
          con.executescript(open("migrations/0002_seed_recipes.sql",encoding="utf-8").read())
          for table in ("recipes","ingredient_groups","ingredients","instruction_groups","instruction_steps"):
              print(f"{table}: {con.execute('SELECT COUNT(*) FROM '+table).fetchone()[0]}")
          assert con.execute("SELECT COUNT(*) FROM recipes").fetchone()[0]>0
          for table in ("ingredients","instruction_steps"):
              assert con.execute("SELECT COUNT(*) FROM "+table).fetchone()[0]>0
          print("Seed validation passed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recipes-d1-seed-sql
          path: migrations/0002_seed_recipes.sql
          retention-days: 14
